# Staging agent (S74b B7). Pins the SAME image tag production runs — the
# staging agent is the promotion-verification twin, never a different build.
# Deploy: pcc deploy --config-file pcc-deploy.staging.toml
agent_name = "human-virtual-agent-staging"
image = "haiolli/human-virtual-agent:0.16"
secret_set = "human-virtual-agent-staging-secrets"
agent_profile = "agent-2x"

[scaling]
  min_agents = 1
